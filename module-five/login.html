            <div class="container col-md-6">
                <div class="card" style="margin-top: 20%;">
                    <div class="card-header">
                        <div class="card-title">Login to YCP LSAD</div>
                    </div>
                    <div class="card-body">
                        <div>
                            <p id="message"></p>
                        </div>

                        <form class="row align-items-center" id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" aria-describedby="emailHelp">
                                <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password">
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                                <label class="form-check-label" for="exampleCheck1">Check me out</label>
                            </div>
                            <button type="submit" class="btn btn-primary" id="submitBtn">Submit</button>
                        </form>

                    <div class="card-footer">

                    </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script>
            const loginForm = document.getElementById("loginForm");
            const submitBtn = document.getElementById("submitBtn");
            const message = document.getElementById("message");

            const emailField = document.getElementById("email");
            const passwordField = document.getElementById("password");

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.textContent = "Saving..."
                
                if(!isValidEmail(emailField.value)){
                    message.style.color = 'red';
                    message.textContent = 'Invalid email address'
                    emailField.focus();
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Submit";
                    return;
                }
            
                // const payload = {
                //     "email": emailField.value,
                //     "password": passwordField.value,
                // }

                const payload = localStorage.getItem(emailField.value)
                if(payload && payload.email == emailField.value && payload.password === passwordField.value){
                    message.style.color = 'green';
                    message.textContent = 'Login was successful!'

                    emailField.value = ''
                    passwordField.value = ''
                    submitBtn.textContent = "Saved"
                }else {
                    message.style.color = 'red';
                    message.textContent = 'Invalid credentials!'

                    emailField.focus()
                    passwordField.value = ''
                    submitBtn.textContent = "Submit"
                    submitBtn.disabled = false;

                }
               

            })

            const isValidEmail = (email) => {
                
                return email || email == null;
            }
        </script>
